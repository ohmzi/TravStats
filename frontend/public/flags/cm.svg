<!--
  Cameroon — one of the journeys-card band's flags (owner, 2026-10-09).

  Design source: flag-icons 7.5.0, `flags/4x3/cm.svg`, the set the repo
  already vendors for the backend (backend/node_modules/flag-icons).
  Copied here, verbatim, from that in-repo dependency — NOT downloaded
  from the internet, and never fetched at build or runtime. Regenerate
  every flag from that dependency with `node scripts/vendor-flags.mjs`.

  Why a local copy at all: the frontend's own flag component (`FlagImg`)
  loads `https://flagcdn.com` at RUNTIME, which the owner's rule forbids
  for the card band. The band paints only assets this repository ships.

  Licence: MIT — Copyright (c) 2013 Panayiotis Lipiridis. See
  backend/node_modules/flag-icons/LICENSE. Colours used: #007a5e, #ce1126, #fcd116.
-->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" id="flag-icons-cm" viewBox="0 0 640 480">
  <path fill="#007a5e" d="M0 0h213.3v480H0z"/>
  <path fill="#ce1126" d="M213.3 0h213.4v480H213.3z"/>
  <path fill="#fcd116" d="M426.7 0H640v480H426.7z"/>
  <g fill="#fcd116" transform="translate(320 240)scale(7.1111)">
    <g id="cm-b">
      <path id="cm-a" d="M0-8-2.5-.4 1.3.9z"/>
      <use xlink:href="#cm-a" width="100%" height="100%" transform="scale(-1 1)"/>
    </g>
    <use xlink:href="#cm-b" width="100%" height="100%" transform="rotate(72)"/>
    <use xlink:href="#cm-b" width="100%" height="100%" transform="rotate(144)"/>
    <use xlink:href="#cm-b" width="100%" height="100%" transform="rotate(-144)"/>
    <use xlink:href="#cm-b" width="100%" height="100%" transform="rotate(-72)"/>
  </g>
</svg>
