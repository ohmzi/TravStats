<!--
  Rwanda — one of the journeys-card band's flags (owner, 2026-10-09).

  Design source: flag-icons 7.5.0, `flags/4x3/rw.svg`, the set the repo
  already vendors for the backend (backend/node_modules/flag-icons).
  Copied here, verbatim, from that in-repo dependency — NOT downloaded
  from the internet, and never fetched at build or runtime. Regenerate
  every flag from that dependency with `node scripts/vendor-flags.mjs`.

  Why a local copy at all: the frontend's own flag component (`FlagImg`)
  loads `https://flagcdn.com` at RUNTIME, which the owner's rule forbids
  for the card band. The band paints only assets this repository ships.

  Licence: MIT — Copyright (c) 2013 Panayiotis Lipiridis. See
  backend/node_modules/flag-icons/LICENSE. Colours used: #20603d, #fad201, #00a1de, #e5be01.
-->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" id="flag-icons-rw" viewBox="0 0 640 480">
  <path fill="#20603d" d="M0 0h640v480H0z"/>
  <path fill="#fad201" d="M0 0h640v360H0z"/>
  <path fill="#00a1de" d="M0 0h640v240H0z"/>
  <g transform="translate(511 125.4)scale(.66667)">
    <g id="rw-b">
      <path id="rw-a" fill="#e5be01" d="M116.1 0 35.7 4.7l76.4 25.4-78.8-16.3L100.6 58l-72-36.2L82 82.1 21.9 28.6l36.2 72-44.3-67.3L30 112 4.7 35.7 0 116.1-1-1z"/>
      <use xlink:href="#rw-a" width="100%" height="100%" transform="scale(1 -1)"/>
    </g>
    <use xlink:href="#rw-b" width="100%" height="100%" transform="scale(-1 1)"/>
    <circle r="34.3" fill="#e5be01" stroke="#00a1de" stroke-width="3.4"/>
  </g>
</svg>
