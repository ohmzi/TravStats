<!--
  Guinea-Bissau — one of the journeys-card band's flags (owner, 2026-10-09).

  Design source: flag-icons 7.5.0, `flags/4x3/gw.svg`, the set the repo
  already vendors for the backend (backend/node_modules/flag-icons).
  Copied here, verbatim, from that in-repo dependency — NOT downloaded
  from the internet, and never fetched at build or runtime. Regenerate
  every flag from that dependency with `node scripts/vendor-flags.mjs`.

  Why a local copy at all: the frontend's own flag component (`FlagImg`)
  loads `https://flagcdn.com` at RUNTIME, which the owner's rule forbids
  for the card band. The band paints only assets this repository ships.

  Licence: MIT — Copyright (c) 2013 Panayiotis Lipiridis. See
  backend/node_modules/flag-icons/LICENSE. Colours used: #ce1126, #fcd116, #009e49, #000001.
-->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" id="flag-icons-gw" viewBox="0 0 640 480">
  <path fill="#ce1126" d="M0 0h220v480H0z"/>
  <path fill="#fcd116" d="M220 0h420v240H220z"/>
  <path fill="#009e49" d="M220 240h420v240H220z"/>
  <g id="gw-b" transform="matrix(80 0 0 80 110 240)">
    <path id="gw-a" fill="#000001" d="M0-1v1h.5" transform="rotate(18 0 -1)"/>
    <use xlink:href="#gw-a" width="100%" height="100%" transform="scale(-1 1)"/>
  </g>
  <use xlink:href="#gw-b" width="100%" height="100%" transform="rotate(72 110 240)"/>
  <use xlink:href="#gw-b" width="100%" height="100%" transform="rotate(144 110 240)"/>
  <use xlink:href="#gw-b" width="100%" height="100%" transform="rotate(-144 110 240)"/>
  <use xlink:href="#gw-b" width="100%" height="100%" transform="rotate(-72 110 240)"/>
</svg>
