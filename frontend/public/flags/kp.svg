<!--
  North Korea — one of the journeys-card band's flags (owner, 2026-10-09).

  Design source: flag-icons 7.5.0, `flags/4x3/kp.svg`, the set the repo
  already vendors for the backend (backend/node_modules/flag-icons).
  Copied here, verbatim, from that in-repo dependency — NOT downloaded
  from the internet, and never fetched at build or runtime. Regenerate
  every flag from that dependency with `node scripts/vendor-flags.mjs`.

  Why a local copy at all: the frontend's own flag component (`FlagImg`)
  loads `https://flagcdn.com` at RUNTIME, which the owner's rule forbids
  for the card band. The band paints only assets this repository ships.

  Licence: MIT — Copyright (c) 2013 Panayiotis Lipiridis. See
  backend/node_modules/flag-icons/LICENSE. Colours used: #fff, #3e5698, #c60000, #c40000.
-->
<svg xmlns="http://www.w3.org/2000/svg" id="flag-icons-kp" viewBox="0 0 640 480">
  <defs>
    <clipPath id="kp-a">
      <path fill-opacity=".7" d="M5 .1h682.6V512H5.1z"/>
    </clipPath>
  </defs>
  <g fill-rule="evenodd" clip-path="url(#kp-a)" transform="translate(-4.8 -.1)scale(.93768)">
    <path fill="#fff" stroke="#000" d="M776 511.5H-76V.5h852z"/>
    <path fill="#3e5698" d="M776 419H-76v92.5h852z"/>
    <path fill="#c60000" d="M776 397.6H-76V114.4h852z"/>
