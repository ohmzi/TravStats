<!--
  Gambia — one of the journeys-card band's flags (owner, 2026-10-09).

  Design source: flag-icons 7.5.0, `flags/4x3/gm.svg`, the set the repo
  already vendors for the backend (backend/node_modules/flag-icons).
  Copied here, verbatim, from that in-repo dependency — NOT downloaded
  from the internet, and never fetched at build or runtime. Regenerate
  every flag from that dependency with `node scripts/vendor-flags.mjs`.

  Why a local copy at all: the frontend's own flag component (`FlagImg`)
  loads `https://flagcdn.com` at RUNTIME, which the owner's rule forbids
  for the card band. The band paints only assets this repository ships.

  Licence: MIT — Copyright (c) 2013 Panayiotis Lipiridis. See
  backend/node_modules/flag-icons/LICENSE. Colours used: red, #fff, #009, #090.
-->
<svg xmlns="http://www.w3.org/2000/svg" id="flag-icons-gm" viewBox="0 0 640 480">
  <defs>
    <clipPath id="gm-a">
      <path fill-opacity=".7" d="M0-48h640v480H0z"/>
    </clipPath>
  </defs>
  <g fill-rule="evenodd" stroke-width="1pt" clip-path="url(#gm-a)" transform="translate(0 48)">
    <path fill="red" d="M0-128h640V85.3H0z"/>
    <path fill="#fff" d="M0 85.3h640V121H0z"/>
    <path fill="#009" d="M0 120.9h640V263H0z"/>
    <path fill="#fff" d="M0 263.1h640v35.6H0z"/>
    <path fill="#090" d="M0 298.7h640V512H0z"/>
  </g>
</svg>
