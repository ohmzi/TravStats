<!--
  Venezuela — one of the journeys-card band's flags (owner, 2026-10-09).

  Design source: flag-icons 7.5.0, `flags/4x3/ve.svg`, the set the repo
  already vendors for the backend (backend/node_modules/flag-icons).
  Copied here, verbatim, from that in-repo dependency — NOT downloaded
  from the internet, and never fetched at build or runtime. Regenerate
  every flag from that dependency with `node scripts/vendor-flags.mjs`.

  Why a local copy at all: the frontend's own flag component (`FlagImg`)
  loads `https://flagcdn.com` at RUNTIME, which the owner's rule forbids
  for the card band. The band paints only assets this repository ships.

  Licence: MIT — Copyright (c) 2013 Panayiotis Lipiridis. See
  backend/node_modules/flag-icons/LICENSE. Colours used: #fff, #cf142b, #00247d, #fc0.
-->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" id="flag-icons-ve" viewBox="0 0 640 480">
  <defs>
    <g id="ve-d" transform="translate(0 -36)">
      <g id="ve-c">
        <g id="ve-b">
          <path id="ve-a" fill="#fff" d="M0-5-1.5-.2l2.8.9z"/>
          <use xlink:href="#ve-a" width="180" height="120" transform="scale(-1 1)"/>
        </g>
        <use xlink:href="#ve-b" width="180" height="120" transform="rotate(72)"/>
      </g>
      <use xlink:href="#ve-b" width="180" height="120" transform="rotate(-72)"/>
      <use xlink:href="#ve-c" width="180" height="120" transform="rotate(144)"/>
    </g>
  </defs>
  <path fill="#cf142b" d="M0 0h640v480H0z"/>
  <path fill="#00247d" d="M0 0h640v320H0z"/>
  <path fill="#fc0" d="M0 0h640v160H0z"/>
  <g id="ve-f" transform="matrix(4 0 0 4 320 336)">
    <g id="ve-e">
      <use xlink:href="#ve-d" width="180" height="120" transform="rotate(10)"/>
      <use xlink:href="#ve-d" width="180" height="120" transform="rotate(30)"/>
    </g>
    <use xlink:href="#ve-e" width="180" height="120" transform="rotate(40)"/>
  </g>
  <use xlink:href="#ve-f" width="180" height="120" transform="rotate(-80 320 336)"/>
</svg>
