<!--
  Bouvet Island — one of the journeys-card band's flags (owner, 2026-10-09).

  Design source: flag-icons 7.5.0, `flags/4x3/bv.svg`, the set the repo
  already vendors for the backend (backend/node_modules/flag-icons).
  Copied here, verbatim, from that in-repo dependency — NOT downloaded
  from the internet, and never fetched at build or runtime. Regenerate
  every flag from that dependency with `node scripts/vendor-flags.mjs`.

  Why a local copy at all: the frontend's own flag component (`FlagImg`)
  loads `https://flagcdn.com` at RUNTIME, which the owner's rule forbids
  for the card band. The band paints only assets this repository ships.

  Licence: MIT — Copyright (c) 2013 Panayiotis Lipiridis. See
  backend/node_modules/flag-icons/LICENSE. Colours used: #fff, #d72828, #003897.
-->
<svg xmlns="http://www.w3.org/2000/svg" id="flag-icons-bv" viewBox="0 0 640 480">
  <defs>
    <clipPath id="bv-a">
      <path fill-opacity=".7" d="M0 0h640v480H0z"/>
    </clipPath>
  </defs>
  <g fill-rule="evenodd" stroke-width="1pt" clip-path="url(#bv-a)">
    <path fill="#fff" d="M-28 0h699.7v512H-28z"/>
    <path fill="#d72828" d="M-53-77.8h218.7v276.2H-53zM289.4-.6h381v199h-381zM-27.6 320h190.4v190.3H-27.6zm319.6 2.1h378.3v188.2H292z"/>
    <path fill="#003897" d="M196.7-25.4H261v535.7h-64.5z"/>
    <path fill="#003897" d="M-27.6 224.8h698v63.5h-698z"/>
  </g>
</svg>
