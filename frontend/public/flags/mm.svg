<!--
  Myanmar (Burma) — one of the journeys-card band's flags (owner, 2026-10-09).

  Design source: flag-icons 7.5.0, `flags/4x3/mm.svg`, the set the repo
  already vendors for the backend (backend/node_modules/flag-icons).
  Copied here, verbatim, from that in-repo dependency — NOT downloaded
  from the internet, and never fetched at build or runtime. Regenerate
  every flag from that dependency with `node scripts/vendor-flags.mjs`.

  Why a local copy at all: the frontend's own flag component (`FlagImg`)
  loads `https://flagcdn.com` at RUNTIME, which the owner's rule forbids
  for the card band. The band paints only assets this repository ships.

  Licence: MIT — Copyright (c) 2013 Panayiotis Lipiridis. See
  backend/node_modules/flag-icons/LICENSE. Colours used: #fecb00, #34b233, #ea2839, #fff.
-->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" id="flag-icons-mm" viewBox="0 0 640 480">
  <path fill="#fecb00" d="M0 0h640v480H0z"/>
  <path fill="#34b233" d="M0 160h640v320H0z"/>
  <path fill="#ea2839" d="M0 320h640v160H0z"/>
  <g transform="translate(320 256.9)scale(176.87999)">
    <path id="mm-a" fill="#fff" d="m0-1 .3 1h-.6z"/>
    <use xlink:href="#mm-a" width="100%" height="100%" transform="rotate(-144)"/>
    <use xlink:href="#mm-a" width="100%" height="100%" transform="rotate(-72)"/>
    <use xlink:href="#mm-a" width="100%" height="100%" transform="rotate(72)"/>
    <use xlink:href="#mm-a" width="100%" height="100%" transform="rotate(144)"/>
  </g>
</svg>
