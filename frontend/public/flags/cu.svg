<!--
  Cuba — one of the journeys-card band's flags (owner, 2026-10-09).

  Design source: flag-icons 7.5.0, `flags/4x3/cu.svg`, the set the repo
  already vendors for the backend (backend/node_modules/flag-icons).
  Copied here, verbatim, from that in-repo dependency — NOT downloaded
  from the internet, and never fetched at build or runtime. Regenerate
  every flag from that dependency with `node scripts/vendor-flags.mjs`.

  Why a local copy at all: the frontend's own flag component (`FlagImg`)
  loads `https://flagcdn.com` at RUNTIME, which the owner's rule forbids
  for the card band. The band paints only assets this repository ships.

  Licence: MIT — Copyright (c) 2013 Panayiotis Lipiridis. See
  backend/node_modules/flag-icons/LICENSE. Colours used: #002a8f, #fff, #cb1515.
-->
<svg xmlns="http://www.w3.org/2000/svg" id="flag-icons-cu" viewBox="0 0 640 480">
  <defs>
    <clipPath id="cu-a">
      <path fill-opacity=".7" d="M-32 0h682.7v512H-32z"/>
    </clipPath>
  </defs>
  <g fill-rule="evenodd" clip-path="url(#cu-a)" transform="translate(30)scale(.94)">
    <path fill="#002a8f" d="M-32 0h768v512H-32z"/>
    <path fill="#fff" d="M-32 102.4h768v102.4H-32zm0 204.8h768v102.4H-32z"/>
    <path fill="#cb1515" d="m-32 0 440.7 255.7L-32 511z"/>
    <path fill="#fff" d="M161.8 325.5 114.3 290l-47.2 35.8 17.6-58.1-47.2-36 58.3-.4 18.1-58 18.5 57.8 58.3.1-46.9 36.3z"/>
  </g>
</svg>
