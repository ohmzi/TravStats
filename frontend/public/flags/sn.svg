  <g fill-rule="evenodd" stroke-width="1pt">
    <path fill="#0b7226" d="M0 0h213.3v480H0z"/>
    <path fill="#ff0" d="M213.3 0h213.3v480H213.3z"/>
    <path fill="#bc0000" d="M426.6 0H640v480H426.6z"/>
  </g>
