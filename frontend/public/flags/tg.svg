  <defs>
    <clipPath id="tg-a">
      <path fill-opacity=".7" d="M0 0h682.7v512H0z"/>
    </clipPath>
  </defs>
  <g fill-rule="evenodd" clip-path="url(#tg-a)" transform="scale(.9375)">
    <path fill="#ffe300" d="M0 0h767.6v512H0z"/>
