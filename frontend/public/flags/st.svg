<!--
  São Tomé & Príncipe — one of the journeys-card band's flags (owner, 2026-10-09).

  Design source: flag-icons 7.5.0, `flags/4x3/st.svg`, the set the repo
  already vendors for the backend (backend/node_modules/flag-icons).
  Copied here, verbatim, from that in-repo dependency — NOT downloaded
  from the internet, and never fetched at build or runtime. Regenerate
  every flag from that dependency with `node scripts/vendor-flags.mjs`.

  Why a local copy at all: the frontend's own flag component (`FlagImg`)
  loads `https://flagcdn.com` at RUNTIME, which the owner's rule forbids
  for the card band. The band paints only assets this repository ships.

  Licence: MIT — Copyright (c) 2013 Panayiotis Lipiridis. See
  backend/node_modules/flag-icons/LICENSE. Colours used: #12ad2b, #ffce00, #d21034, #000001.
-->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" id="flag-icons-st" viewBox="0 0 640 480">
  <path fill="#12ad2b" d="M0 0h640v480H0z"/>
  <path fill="#ffce00" d="M0 137.1h640V343H0z"/>
  <path fill="#d21034" d="M0 0v480l240-240"/>
  <g id="st-c" transform="translate(351.6 240)scale(.34286)">
    <g id="st-b">
      <path id="st-a" fill="#000001" d="M0-200V0h100" transform="rotate(18 0 -200)"/>
      <use xlink:href="#st-a" width="100%" height="100%" transform="scale(-1 1)"/>
    </g>
    <use xlink:href="#st-b" width="100%" height="100%" transform="rotate(72)"/>
    <use xlink:href="#st-b" width="100%" height="100%" transform="rotate(144)"/>
    <use xlink:href="#st-b" width="100%" height="100%" transform="rotate(-144)"/>
    <use xlink:href="#st-b" width="100%" height="100%" transform="rotate(-72)"/>
  </g>
  <use xlink:href="#st-c" width="100%" height="100%" x="700" transform="translate(-523.2)"/>
</svg>
