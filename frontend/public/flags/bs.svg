<!--
  Bahamas — one of the journeys-card band's flags (owner, 2026-10-09).

  Design source: flag-icons 7.5.0, `flags/4x3/bs.svg`, the set the repo
  already vendors for the backend (backend/node_modules/flag-icons).
  Copied here, verbatim, from that in-repo dependency — NOT downloaded
  from the internet, and never fetched at build or runtime. Regenerate
  every flag from that dependency with `node scripts/vendor-flags.mjs`.

  Why a local copy at all: the frontend's own flag component (`FlagImg`)
  loads `https://flagcdn.com` at RUNTIME, which the owner's rule forbids
  for the card band. The band paints only assets this repository ships.

  Licence: MIT — Copyright (c) 2013 Panayiotis Lipiridis. See
  backend/node_modules/flag-icons/LICENSE. Colours used: #fff, #ffe900, #08ced6, #000001.
-->
<svg xmlns="http://www.w3.org/2000/svg" id="flag-icons-bs" viewBox="0 0 640 480">
  <defs>
    <clipPath id="bs-a">
      <path fill-opacity=".7" d="M-12 0h640v480H-12z"/>
    </clipPath>
  </defs>
  <g fill-rule="evenodd" clip-path="url(#bs-a)" transform="translate(12)">
    <path fill="#fff" d="M968.5 480h-979V1.8h979z"/>
    <path fill="#ffe900" d="M968.5 344.5h-979V143.3h979z"/>
    <path fill="#08ced6" d="M968.5 480h-979V320.6h979zm0-318.7h-979V2h979z"/>
    <path fill="#000001" d="M-11 0c2.3 0 391.8 236.8 391.8 236.8L-12 479.2z"/>
  </g>
</svg>
