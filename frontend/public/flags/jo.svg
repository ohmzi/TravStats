  <defs>
    <clipPath id="jo-a">
      <path fill-opacity=".7" d="M-117.8 0h682.6v512h-682.6z"/>
    </clipPath>
  </defs>
  <g clip-path="url(#jo-a)" transform="translate(110.5)scale(.9375)">
