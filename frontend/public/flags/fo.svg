<!--
  Faroe Islands — one of the journeys-card band's flags (owner, 2026-10-09).

  Design source: flag-icons 7.5.0, `flags/4x3/fo.svg`, the set the repo
  already vendors for the backend (backend/node_modules/flag-icons).
  Copied here, verbatim, from that in-repo dependency — NOT downloaded
  from the internet, and never fetched at build or runtime. Regenerate
  every flag from that dependency with `node scripts/vendor-flags.mjs`.

  Why a local copy at all: the frontend's own flag component (`FlagImg`)
  loads `https://flagcdn.com` at RUNTIME, which the owner's rule forbids
  for the card band. The band paints only assets this repository ships.

  Licence: MIT — Copyright (c) 2013 Panayiotis Lipiridis. See
  backend/node_modules/flag-icons/LICENSE. Colours used: #fff, #003897, #d72828.
-->
<svg xmlns="http://www.w3.org/2000/svg" id="flag-icons-fo" viewBox="0 0 640 480">
  <defs>
    <clipPath id="fo-a">
      <path fill-opacity=".7" d="M-78 32h640v480H-78z"/>
    </clipPath>
  </defs>
  <g fill-rule="evenodd" stroke-width="0" clip-path="url(#fo-a)" transform="translate(78 -32)">
    <path fill="#fff" d="M-78 32h663.9v480H-78z"/>
    <path fill="#003897" d="M-76 218.7h185.9V32H216v186.7h371.8v106.6H216V512H109.9V325.3h-186z"/>
    <path fill="#d72828" d="M-76 245.3h212.4V32h53.1v213.3H588v53.4H189.5V512h-53V298.7H-76z"/>
  </g>
</svg>
